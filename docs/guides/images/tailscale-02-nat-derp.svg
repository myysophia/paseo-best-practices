<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <marker id="aGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="aOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="aGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">NAT 穿透与 DERP fallback</text>
  <text x="520" y="56" text-anchor="middle" font-size="11" fill="#6b7280">优先直连 P2P(成功率 &gt; 90%);UDP 被封或硬 NAT 失败时,回落 DERP 中继(无法解密)</text>
  <rect x="40" y="110" width="120" height="60" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">节点 A</text>
  <text x="100" y="156" text-anchor="middle" font-size="10" fill="#6b7280">手机 / 100.x.y.z</text>
  <rect x="40" y="190" width="120" height="50" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="100" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">NAT-1</text>
  <text x="100" y="228" text-anchor="middle" font-size="9" fill="#92400e">家庭/办公路由</text>
  <rect x="880" y="110" width="120" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="940" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">节点 B</text>
  <text x="940" y="156" text-anchor="middle" font-size="10" fill="#6b7280">服务器 / 100.x.y.z</text>
  <rect x="880" y="190" width="120" height="50" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="940" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">NAT-2</text>
  <text x="940" y="228" text-anchor="middle" font-size="9" fill="#92400e">云防火墙</text>
  <rect x="430" y="90" width="180" height="64" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">DERP 中继(backup)</text>
  <text x="520" y="134" text-anchor="middle" font-size="10" fill="#6b7280">HTTPS 流承载 WG 包</text>
  <text x="520" y="148" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">⚠ 无法解密,只盲转</text>
  <path d="M 160,225 C 400,360 640,360 880,225" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#aGreen)"/>
  <rect x="445" y="345" width="150" height="22" fill="#ffffff" opacity="0.95"/>
  <text x="520" y="356" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">✓ 直连 P2P (UDP 打洞)</text>
  <text x="520" y="370" text-anchor="middle" font-size="10" fill="#15803d">STUN/ICE · 90%+ 成功</text>
  <path d="M 160,200 C 280,160 360,140 430,130" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#aOrange)"/>
  <path d="M 610,130 C 720,140 800,160 880,200" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#aOrange)"/>
  <rect x="250" y="158" width="80" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="290" y="170" text-anchor="middle" font-size="9" fill="#ea580c">UDP 被封</text>
  <rect x="700" y="158" width="100" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="750" y="170" text-anchor="middle" font-size="9" fill="#ea580c">fallback 盲转</text>
  <rect x="40" y="430" width="960" height="110" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="60" y="456" font-size="12" font-weight="600" fill="#9a3412">为什么有的 NAT 打不通?</text>
  <text x="60" y="476" font-size="11" fill="#374151">• <tspan font-weight="600">软 NAT(对称/锥形)</tspan>:源端口稳定,STUN 能发现,可打洞 → 直连成功</text>
  <text x="60" y="494" font-size="11" fill="#374151">• <tspan font-weight="600">硬 NAT(对称式)</tspan>:每个目标分配不同源端口,双方猜不到对方端口 → 打洞失败</text>
  <text x="60" y="512" font-size="11" fill="#374151">• <tspan font-weight="600">UDP 完全封禁</tspan>:酒店/公司防火墙禁 UDP → 必走 DERP(HTTPS 443 穿透)</text>
  <text x="60" y="530" font-size="11" fill="#374151">→ 失败时自动回落 DERP,保证连通;DERP 看不到明文(WireGuard 已端到端加密)</text>
  <g transform="translate(40, 568)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>
    <text x="34" y="12" font-size="10" fill="#374151">直连(优先)</text>
    <line x1="130" y1="8" x2="158" y2="8" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#aOrange)"/>
    <text x="164" y="12" font-size="10" fill="#374151">DERP fallback(失败时)</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="aPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0d9488"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1040" height="620" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">扩展能力:subnet router 与 exit node</text>
  <text x="520" y="56" text-anchor="middle" font-size="11" fill="#6b7280">tailnet 里的特殊角色节点,扩展接入面</text>
  <rect x="30" y="90" width="480" height="470" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="116" font-size="14" font-weight="600" fill="#0f766e">subnet router · 暴露整个网段</text>
  <text x="50" y="134" font-size="10" fill="#6b7280">一台节点暴露 192.168.x.x/24,其他设备免装 Tailscale 即可访问该网段</text>
  <rect x="50" y="155" width="280" height="170" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="62" y="174" font-size="11" font-weight="600" fill="#15803d">tailnet(100.x.y.z)</text>
  <rect x="70" y="190" width="100" height="44" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="120" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">手机</text>
  <text x="120" y="225" text-anchor="middle" font-size="9" fill="#6b7280">100.x.y.z</text>
  <rect x="190" y="190" width="120" height="44" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="250" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">笔记本</text>
  <text x="250" y="225" text-anchor="middle" font-size="9" fill="#6b7280">100.x.y.z</text>
  <rect x="110" y="255" width="160" height="55" rx="6" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">subnet router 节点</text>
  <text x="190" y="293" text-anchor="middle" font-size="9" fill="#0f766e">--advertise-routes=192.168.1.0/24</text>
  <path d="M 120,234 L 160,255" stroke="#0d9488" stroke-width="1.3" fill="none" marker-end="url(#aTeal)"/>
  <path d="M 250,234 L 220,255" stroke="#0d9488" stroke-width="1.3" fill="none" marker-end="url(#aTeal)"/>
  <rect x="60" y="355" width="200" height="100" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="160" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">家庭/机房 LAN</text>
  <text x="160" y="394" text-anchor="middle" font-size="10" fill="#6b7280">192.168.1.0/24</text>
  <rect x="74" y="404" width="78" height="38" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="113" y="422" text-anchor="middle" font-size="10" fill="#374151">NAS</text>
  <text x="113" y="435" text-anchor="middle" font-size="8" fill="#6b7280">.10</text>
  <rect x="170" y="404" width="78" height="38" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="209" y="422" text-anchor="middle" font-size="10" fill="#374151">打印机</text>
  <text x="209" y="435" text-anchor="middle" font-size="8" fill="#6b7280">.20</text>
  <path d="M 190,310 L 160,355" stroke="#0d9488" stroke-width="1.8" fill="none" marker-end="url(#aTeal)"/>
  <text x="290" y="396" font-size="10" fill="#0f766e">▸ 手机直接 ping 192.168.1.10</text>
  <text x="290" y="414" font-size="10" fill="#0f766e">▸ 笔记本访问机房内网服务</text>
  <text x="290" y="432" font-size="10" fill="#0f766e">▸ K8s 集群整体接入 tailnet</text>
  <text x="50" y="490" font-size="10" fill="#92400e">⚡ 用途:家庭实验室 / 机房机柜 / K8s 集群接入,无需每台装客户端</text>
  <rect x="530" y="90" width="480" height="470" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="550" y="116" font-size="14" font-weight="600" fill="#1e40af">exit node · 统一出口</text>
  <text x="550" y="134" font-size="10" fill="#6b7280">所有上网流量经该节点转发,等效商业 VPN,但 IP 是自己的</text>
  <rect x="550" y="155" width="240" height="155" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="562" y="174" font-size="11" font-weight="600" fill="#15803d">tailnet(100.x.y.z)</text>
  <rect x="570" y="190" width="90" height="44" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="615" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">出差</text>
  <text x="615" y="225" text-anchor="middle" font-size="9" fill="#6b7280">手机</text>
  <rect x="680" y="190" width="100" height="44" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="730" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">咖啡店</text>
  <text x="730" y="225" text-anchor="middle" font-size="9" fill="#6b7280">笔记本</text>
  <rect x="610" y="250" width="140" height="48" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">exit node 节点</text>
  <text x="680" y="288" text-anchor="middle" font-size="9" fill="#1e40af">--advertise-exit-node</text>
  <path d="M 615,234 L 650,250" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#aBlue)"/>
  <path d="M 730,234 L 710,250" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#aBlue)"/>
  <path d="M 590,395 q -30,-40 10,-50 q 0,-40 50,-30 q 20,-30 60,-10 q 40,-20 60,20 q 40,5 25,40 q 20,35 -20,40 q -10,25 -50,15 q -40,25 -80,-5 q -50,5 -55,-20 z" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="680" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">公网 / Internet</text>
  <path d="M 680,300 L 680,345" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#aBlue)"/>
  <rect x="640" y="318" width="80" height="14" fill="#eff6ff" opacity="0.95"/>
  <text x="680" y="329" text-anchor="middle" font-size="9" fill="#1e40af">所有上网流量</text>
  <text x="820" y="200" font-size="10" fill="#1e40af">▸ 绕过公共 WiFi 监听</text>
  <text x="820" y="218" font-size="10" fill="#1e40af">▸ 统一出口审计</text>
  <text x="820" y="236" font-size="10" fill="#1e40af">▸ IP 独享(非共享商业 VPN)</text>
  <text x="820" y="254" font-size="10" fill="#1e40af">▸ 出差安全上网</text>
  <text x="550" y="490" font-size="10" fill="#92400e">⚡ 用途:绕网络限制 / 出差安全 / 统一出口审计(IP 是自己的,不被封)</text>
  <rect x="30" y="565" width="980" height="42" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="50" y="584" font-size="11" font-weight="600" fill="#92400e">⚠ 最佳实践:subnet router 与 exit node 不要混用同一台节点</text>
  <text x="50" y="600" font-size="10" fill="#92400e">职责分离:subnet router 负责"向内"暴露网段,exit node 负责"向外"统一出口;混用会让流量路径混乱、ACL 难写</text>
</svg>